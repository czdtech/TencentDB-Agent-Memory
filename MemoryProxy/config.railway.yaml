    newapi-tencent-grok:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_GROK}"
    cliproxyapi-tencent-gemini:
      url: https://cliproxyapi-production-8e60.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_GEMINI}"
    newapi-tencent-cc-qayk:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_CC}"
    newapi-tencent-pro-qayk:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_UPSTREAM_API_KEY}"
    # 超管（全局记忆总管）走 DeepSeek 官方，不经中转站
    dsh:
      url: https://api.deepseek.com/v1
      apiKey: "${PROXY_AGENT_KEY_DSH}"
log:
  file: /data/tdai-memory-proxy/logs
  level: info
  backend: console
tdai:
  enabled: true
  endpoint: http://memory-core.railway.internal:8420
  apiKey: "${TDAI_CORE_USER_KEY}"
  serviceId: default
  memory:
    enabled: true
    inject: true
    writeL0: true
    recallL1: true
    injectL2L3: true
skill:
  endpoint: http://memory-core.railway.internal:8420
  serviceToken: "${TDAI_CORE_USER_KEY}"
knowledge:
  enabled: true
  endpoint: http://memory-core.railway.internal:8420
  serviceToken: "${TDAI_CORE_USER_KEY}"
  serviceId: default
  timeoutMs: 5000
auth:
  enabled: true
  url: http://memory-core.railway.internal:8420
  timeoutMs: 5000
sessionInit:
  enabled: true
  maxRetries: 3
  injectAgentContext: true
  injectTaskContext: true
  defaultTaskId: task-awshfblu7q
  # 每条上游路由的默认身份。客户端显式携带 x-team-id / x-agent-id 时以 header 为准
  # （headerAutoSelect），此处仅作为未带头时的预设。模型路由不改变记忆身份：
  # 同一工位换模型仍落在同一个 agent 上。
  routeIdentities:
    # ── 个人工位（team-awpqj5bfn6）──
    omp:
      team_id: team-awpqj5bfn6
      agent_id: agt-awrde599w5
      task_id: task-awshfblu7q
    claude-code:
      team_id: team-awpqj5bfn6
