    # 不带 task_id：跨团队检索需要覆盖各来源的全部记忆
    dsh:
      team_id: team-9wnq4ojn52
      agent_id: agt-9wnqlax2mz
  headerAutoSelect:
    enabled: true
    teamHeader: x-team-id
    agentHeader: x-agent-id
    taskHeader: x-task-id
    onMismatch: bypass
injection:
  enabled: true
  injectors:
  - skill
  - knowledge
  - tdai-memory
extraction:
  enabled: true
  extractors:
  - skill
  - tdai-memory
redis:
  enabled: false
storage:
  enabled: true
  backend: sqlite
  ttlDays: 7
  sqlite:
    dbPath: /data/tdai-memory-proxy/proxy.db
  fs:
    fsRoot: /data/tdai-memory-proxy/fs
opik:
  enabled: false
langfuse:
  enabled: false
clickhouse:
  enabled: false
creditReport:
  enabled: false
superAdmin:
  enabled: true
  team_id: "team-9wnq4ojn52"
  apiKey: "${TDAI_PROXY_ADMIN_API_KEY}"
  # 显式来源清单：只有 team-9wnq4ojn52 上的身份会额外看到这些来源；其他 team 的
  # 身份无论此表内容都只看自己 + 本 team 授权绑定。这里的条目同时决定
  # 「自动注入（fixed asset）」与「显式读取（memory-bridge）」的可见范围 ——
  # 二者共用同一份判定，避免出现注入与读取范围不一致。
  # 跨来源只读：超管可读这些来源，但对其发起的写/更新/删除会被拒绝。
  sources:
    # ── 个人助理 ──
    - team_id: team-awpqj5bfn6
      user_id: usr-9wnp5led1n
      agent_id: agt-awrde599w5
      name: personal/omp
    - team_id: team-awpqj5bfn6
      user_id: usr-9wnp5led1n
      agent_id: agt-awrdcsatvm
      name: personal/claude-code
    - team_id: team-awpqj5bfn6
      user_id: usr-9wnp5led1n
      agent_id: agt-awre8n2eew
      name: personal/codex
    - team_id: team-awpqj5bfn6
      user_id: usr-9wnp5led1n
      agent_id: agt-awreze0em1
      name: personal/genericagent
    - team_id: team-awpqj5bfn6
      user_id: usr-9wnp5led1n
      agent_id: agt-awre4n162g
      name: personal/cursor
    # ── 评测团队 ──
    - team_id: team-9wnplsilcp
      user_id: usr-9wnp5led1n
      agent_id: agt-9wnq5fhdpt
      name: evaluation/omp-eval
    - team_id: team-9wnplsilcp
      user_id: usr-9wnp5led1n
      agent_id: agt-awrfkdpcf9
      name: evaluation/genericagent-win
    - team_id: team-9wnplsilcp
      user_id: usr-9wnp5led1n
      agent_id: agt-awrfr5frbm
      name: evaluation/coordinator
    # ── 开发三席 ──
    - team_id: team-9wnqh5zsy3
      user_id: usr-9wnp5led1n
      agent_id: agt-9wnqqh0a1b
      name: dev/lead
    - team_id: team-9wnqh5zsy3
      user_id: usr-9wnp5led1n
      agent_id: agt-awrgjid5tc
      name: dev/reviewer
    - team_id: team-9wnqh5zsy3
      user_id: usr-9wnp5led1n
      agent_id: agt-awrgd0ncgb
      name: dev/writer
admin:
  apiKey: "${TDAI_PROXY_ADMIN_API_KEY}"
  # 运维旁路代表的内核 user_key（内核 Layer3 校验用）。留空会让 fixed-asset 等
  # 调用以 admin token 充当 user_key 被内核拒绝（401 invalid_user_key）。
  userKey: "${TDAI_CORE_USER_KEY}"
