server:
  host: 0.0.0.0
  port: 8096
  forwardTimeoutMs: 600000
upstream:
  url: https://new-api-production-e8f1.up.railway.app/v1
  apiKey: "${PROXY_UPSTREAM_API_KEY}"
  # 这里的 name 只做一件事：按 URL 第一段选「上游 + 上游 key」。
  # 记忆身份不在这张表上 —— 一律由客户端请求头 x-team-id / x-agent-id / x-task-id
  # 决定（见 sessionInit.routeIdentities 的说明）。删掉某个条目会让该路由退回
  # 全局上游与全局 key，对应客户端直接 401，所以宁可留着不用也别删。
  agents:
    claude-code:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_CC}"
    codex:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_UPSTREAM_API_KEY}"
    newapi-tencent-cc:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_CC}"
    newapi-tencent-pro:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_UPSTREAM_API_KEY}"
    newapi-tencent-pro-low:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_UPSTREAM_API_KEY}"
    newapi-tencent-ds:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_DS}"
    newapi-tencent-kimi:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_KIMI}"
    newapi-tencent-glm:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_GLM}"
    newapi-tencent-grok:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_GROK}"
    cliproxyapi-tencent-gemini:
      url: https://cliproxyapi-production-8e60.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_GEMINI}"
    newapi-tencent-cc-qayk:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_AGENT_KEY_CC}"
    newapi-tencent-pro-qayk:
      url: https://new-api-production-e8f1.up.railway.app/v1
      apiKey: "${PROXY_UPSTREAM_API_KEY}"
    # 幕僚长（全局记忆总管）走 DeepSeek 官方，不经中转站。
    # DSH 只会 Anthropic Messages 协议；DeepSeek 的 Messages 端点在 /anthropic 下。
    dsh:
      url: https://api.deepseek.com/anthropic/v1
      apiKey: "${PROXY_AGENT_KEY_DSH}"
    # 巡检验证员：opencode 走 OpenAI Chat Completions，直连 DeepSeek 官方
    # /v1/chat/completions。模型名必须发 deepseek-chat —— DeepSeek 官方没有
    # "flash" 这个 ID，别名表在 creditPricing 里，而计费是关的，别指望它兜。
    opencode:
      url: https://api.deepseek.com/v1
      apiKey: "${PROXY_AGENT_KEY_DSH}"
log:
  file: /data/tdai-memory-proxy/logs
  level: info
  backend: console
tdai:
  enabled: true
  endpoint: http://memory-core.railway.internal:8420
  apiKey: "${TDAI_CORE_USER_KEY}"
  serviceId: default
  memory:
    enabled: true
    inject: true
    writeL0: true
    recallL1: true
    # L2/L3 注入的真开关是这个。injection.injectors 那个列表管不到它，
    # 之前误以为删列表就能关注入。
    injectL2L3: true
skill:
  endpoint: http://memory-core.railway.internal:8420
  serviceToken: "${TDAI_CORE_USER_KEY}"
knowledge:
  enabled: true
  endpoint: http://memory-core.railway.internal:8420
  serviceToken: "${TDAI_CORE_USER_KEY}"
  serviceId: default
  timeoutMs: 5000
auth:
  enabled: true
  url: http://memory-core.railway.internal:8420
  timeoutMs: 5000
sessionInit:
  enabled: true
  maxRetries: 3
  injectAgentContext: true
  injectTaskContext: true
  # 这是团队级联里「暂时跳过」那一项的虚拟 ID，必须不是真实 task。
  # 之前填的是真实 task-awshfblu7q：一旦被 auto-select 命中，
  # /v3/atomic/search 会按这个 task 过滤（召回被缩窄），
  # 而 task 详情和参与日志又因为 !==defaultTaskId 的分支被跳过 —— 语义正好拧着。
  defaultTaskId: task-identity-skip
  # 两条路由预设，都是因为客户端发不出身份头：
  #   dsh —— Mac 上的 DSH 没有自定义头的能力；
  #   newapi-tencent-pro-qayk —— Paseo 的 codex runner 只往环境里塞
  #   OPENAI_BASE_URL / OPENAI_API_KEY，没有地方写 x-team-id / x-agent-id。
  # 其余客户端（OMP / Paseo Lead / opencode / tdam-bind 生成的项目配置）都显式带
  # 身份头，不再由路由名决定归属 —— 换模型不改记忆归属，同一席位不同模型落同一个 agent。
  routeIdentities:
    dsh:
      team_id: team-eddlrpyso7
      agent_id: agt-eddr05j3ad
      # 不带 task_id：跨团队总管要覆盖各来源的全部记忆，带 task 会把召回缩窄
    newapi-tencent-pro-qayk:
      team_id: team-eddmd25qjy
      agent_id: agt-eddwxy217t
      # 同样不带 task_id：Reviewer 要在本席位的历史上宽召回
  headerAutoSelect:
    enabled: true
    teamHeader: x-team-id
    agentHeader: x-agent-id
    taskHeader: x-task-id
    # team 不在该用户可见列表、或 agent 不在该 team 下时：
    #   bypass = 把这个会话永久标记成无记忆（写错一次就整轮静默失去记忆，查不到痕迹）
    #   form   = 走资产确认级联，客户端当场看到"要你选团队"的回复
    # 单人多席位要的是后者：配错了要吵，不要闷声丢记忆。
    onMismatch: form
  # 预设 team + agent 都命中时跳过资产确认弹框，一步到位 initialized。
  skipAssetConfirm: true
injection:
  enabled: true
  # 注入给席位的 <skill_tools>/<tdai_memory_tools> 里那些 curl 用的公网基址。
  # 执行 curl 的是跑在用户机器上的编码客户端，所以必须是公网域名，
  # 不能填 RAILWAY_PRIVATE_DOMAIN。不填时代码退回本机容器 IP:8096，席位根本调不通
  # （线上两边启动日志都实测打了这条 fallback 警告）。
  # ⚠️ 这个字段不走 ${ENV} 展开（config.ts 只做 trim + 去尾斜杠），只能写死。
  # 换 Railway 域名时要一起改这里。
  externalGatewayUrl: https://memory-proxy-production-05b8.up.railway.app
  injectors:
  - skill
  - knowledge
  - tdai-memory
extraction:
  enabled: true
  extractors:
  - skill
  - tdai-memory
redis:
  # 限流器在 v2.0.2 是默认开的（1000000 TPM / 100 QPM），
  # 但没有 Redis 时计数无处落，日志直接打 rate_limit.fail_open 放行。
  # 单人自用的入口本身已被 user key 卡住，这里先不为限流单独买一个 Redis。
  enabled: false
storage:
  enabled: true
  backend: sqlite
  ttlDays: 7
  sqlite:
    dbPath: /data/tdai-memory-proxy/proxy.db
  fs:
    fsRoot: /data/tdai-memory-proxy/fs
opik:
  enabled: false
langfuse:
  enabled: false
clickhouse:
  enabled: false
creditReport:
  enabled: false
superAdmin:
  enabled: true
  team_id: "team-eddlrpyso7"
  apiKey: "${TDAI_PROXY_ADMIN_API_KEY}"
  # 命中条件只看 team_id 是否等于上面的 team —— 与 agent_id / user_id 无关，
  # 所以只有幕僚长团队（team-eddlrpyso7）会额外看到这张表。
  # 这张表同时决定「自动注入（L3 画像 + 3 行 L2 场景索引）」与「memory-bridge
  # 显式读取」的范围，两者共用一份判定，不会出现能注入不能读的不一致。
  # 只读由 isSelf 保证：source 条目恒为 isSelf:false，写/删会 403 code=40304，
  # 比对的是「整三元组是否等于调用者」，不是 user_id —— 下面 user_id 全部等于
  # 调用者自己的 usr-ctyrmbi42c 也关不掉只读保护。
  # user_id 只影响 L0/L1 检索过滤，填错会让该来源的对话召回静默为空（L3/L2 不受影响）。
  # 刻意排除 Reviewer：审查席位要独立视角，总管不许回想它。
  sources:
    - team_id: team-eddmd25qjy
      user_id: usr-ctyrmbi42c
      agent_id: agt-eddslurtwt
      name: 编码开发/Lead
    - team_id: team-eddmd25qjy
      user_id: usr-ctyrmbi42c
      agent_id: agt-eddu029y0z
      name: 编码开发/开发者
    - team_id: team-eddp1ep2s7
      user_id: usr-ctyrmbi42c
      agent_id: agt-eddxuea6az
      name: 运维部署/运维
    - team_id: team-eddp1ep2s7
      user_id: usr-ctyrmbi42c
      agent_id: agt-eddze6hfrd
      name: 运维部署/巡检
admin:
  apiKey: "${TDAI_PROXY_ADMIN_API_KEY}"
  # 运维旁路代表的内核 user_key（内核 Layer3 校验用）。留空会让 fixed-asset 等
  # 调用以 admin token 充当 user_key 被内核拒绝（401 invalid_user_key）。
  userKey: "${TDAI_CORE_USER_KEY}"
