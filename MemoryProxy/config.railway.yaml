    cliproxyapi-tencent-gemini:
      team_id: team-awpqj5bfn6
      agent_id: agt-awrde599w5
      task_id: task-awshfblu7q
    # ── 评测团队（team-9wnplsilcp）──
    genericagent-win:
      team_id: team-9wnplsilcp
      agent_id: agt-awrfkdpcf9
      task_id: task-awshby5o2a
    newapi-tencent-eval:
      team_id: team-9wnplsilcp
      agent_id: agt-9wnq5fhdpt
      task_id: task-awshby5o2a
    # ── 开发三席（team-9wnqh5zsy3）──
    newapi-tencent-cc-qayk:
      team_id: team-9wnqh5zsy3
      agent_id: agt-9wnqqh0a1b
      task_id: task-awsh84s90l
    newapi-tencent-pro-qayk:
      team_id: team-9wnqh5zsy3
      agent_id: agt-awrgjid5tc
