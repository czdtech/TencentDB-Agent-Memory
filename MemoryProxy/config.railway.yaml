      task_id: task-awshfblu7q
    genericagent:
      team_id: team-awpqj5bfn6
      agent_id: agt-awreze0em1
      task_id: task-awshfblu7q
    genericagent-mac:
      team_id: team-awpqj5bfn6
      agent_id: agt-awreze0em1
      task_id: task-awshfblu7q
    newapi-tencent-cc:
      team_id: team-awpqj5bfn6
      agent_id: agt-awrdcsatvm
      task_id: task-awshfblu7q
    newapi-tencent-pro:
      team_id: team-awpqj5bfn6
      agent_id: agt-awre8n2eew
      task_id: task-awshfblu7q
    newapi-tencent-pro-low:
      team_id: team-awpqj5bfn6
      agent_id: agt-awre8n2eew
      task_id: task-awshfblu7q
    newapi-tencent-ds:
      team_id: team-awpqj5bfn6
      agent_id: agt-awrde599w5
      task_id: task-awshfblu7q
    newapi-tencent-glm:
      team_id: team-awpqj5bfn6
